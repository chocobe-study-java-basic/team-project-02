name: Pull Request CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pull-request-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  back-check:
    name: Check the Backend for CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: back/**/*.gradle*

      - name: Run all backend tests
        run: ./gradlew test

      - name: Upload backend test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: back-test-reports
          path: |
            back/build/test-results/test
            back/build/reports/tests/test
          retention-days: 7
          if-no-files-found: warn
      - name: Report backend success
        if: ${{ success() }}
        run: echo "🎉 Backend CI checks passed successfully."

  front-check:
    name: Check the Frontend for CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Report frontend success
        if: ${{ success() }}
        run: echo "🎉 Frontend CI checks passed successfully."
